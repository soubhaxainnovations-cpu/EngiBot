services:
  # ==========================================
  # 1. FastAPI Python Backend Service
  # ==========================================
  - type: web
    name: engibot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/model/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: ENFORCE_PERSISTENT_DB
        value: "true"
      - key: DATABASE_URL
        sync: false # MANDATORY: Persistent PostgreSQL connection string (Supabase / Neon / Render Postgres, port 5432)
      - key: SESSION_SECRET
        generateValue: true # Secure random secret for session token signatures
      - key: ALLOWED_ORIGINS
        value: https://engibot.pages.dev,https://engibot-frontend.onrender.com,https://engibot.vercel.app,http://localhost:5173
      # S3-Compatible Persistent Object Storage (AWS S3, Cloudflare R2, Supabase Storage)
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_ENDPOINT_URL
        sync: false # Optional: for Cloudflare R2 or Supabase S3 endpoint
      - key: S3_PUBLIC_DOMAIN
        sync: false # Optional: CDN or public URL domain for uploads
      # AI Provider Keys
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: auto
      # Email OTP Delivery (HTTPS APIs to bypass Render free SMTP block)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: soubhaxainnovations@gmail.com
      - key: BREVO_SENDER_NAME
        value: EngiBot Assistant

  # ==========================================
  # 2. React / Vite Web Frontend Static Site
  # ==========================================
  - type: web
    name: engibot-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://engibot-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://engibot-backend.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://engibot-backend.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
