services:
  - type: web
    name: engibot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/model/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false # Set to your Supabase PostgreSQL URI
      - key: ANTHROPIC_API_KEY
        sync: false # Optional: Anthropic Claude API Key
      - key: GROQ_API_KEY
        sync: false # Groq API Key for 120B reasoning model
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_API_KEY
        sync: false # Optional: OpenRouter API Key for free cloud models
      - key: OPENROUTER_API_KEY_2
        sync: false # Optional: OpenRouter Secondary API Key
      - key: OPENROUTER_API_KEY_3
        sync: false # Optional: OpenRouter Tertiary API Key
      - key: AI_PROVIDER
        value: auto
      - key: RESEND_API_KEY
        sync: false # Resend HTTPS API Key for cloud email delivery (bypasses Render SMTP block)
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: BREVO_API_KEY
        sync: false # Brevo (Sendinblue) API key: sends to ANY email over HTTPS without custom domain
      - key: BREVO_SENDER_EMAIL
        value: soubhaxainnovations@gmail.com
      - key: BREVO_SENDER_NAME
        value: EngiBot Assistant
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: EngiBot Assistant
      - key: SMTP_FROM_EMAIL
        sync: false

